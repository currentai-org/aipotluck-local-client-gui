# Build the GUI's installers for the ENABLED targets in .github/build-targets.json, and publish them.
#
#   pull_request              build, upload as workflow artifacts only (catch a broken bundle pre-merge)
#   push to main              build, then update the rolling `nightly` PRERELEASE: the `nightly` tag is
#                             moved to this commit and its assets replaced. Stable download URLs:
#                             https://github.com/<repo>/releases/download/nightly/<file>
#   push a tag v<version>     build, then create a DRAFT release (a person reviews, then publishes)
#   workflow_dispatch         build; `only` picks one target -- even a DISABLED one -- so a new
#                             platform can be tried in CI without enabling it for every push
#
# Only enabled targets build by default (Linux today). Windows and macOS are declared but disabled
# until they've been proven locally with `tools/build.sh --release-target <t>`; then flip
# "enabled" in .github/build-targets.json. See docs/RELEASING.md.
#
# GPU support is not a build dimension: one binary per OS x CPU arch covers CUDA/Metal/Vulkan/ROCm,
# because the bundled CLI downloads the matching llama.cpp asset on the user's machine at setup.
#
# Every third-party action is pinned to a full commit SHA (tag in the trailing comment); dependabot
# keeps them current. Builds are UNSIGNED until signing secrets exist (docs/RELEASING.md).

name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      only:
        description: 'Build just this target, even if disabled (e.g. windows-x64); empty = all enabled'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One nightly publish at a time, and a newer push to main supersedes an older one still running:
  # the nightly should always be the tip, never an older commit that happened to finish last.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds, before the matrix, if a tag and the app disagree. The label is what the
      # installer file names carry: the version for a release, version-nightly.DATE.SHA otherwise.
      - name: Version and channel
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v=$(python3 tools/release_version.py --tag "${GITHUB_REF_NAME}")
            label="$v"; channel=release
          else
            v=$(python3 tools/release_version.py --check)
            label="${v}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              channel=nightly
            else
              channel=none
            fi
          fi
          {
            echo "version=$v"
            echo "label=$label"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "version $v, label $label, channel $channel"

      - name: Build matrix
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          m=$(python3 tools/release_version.py --matrix --only "${ONLY}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned CLI is a public submodule; the default token can clone it.
          submodules: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.rust_target }}"
          rustup default stable
          rustc -V

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Tauri CLI
        # The npm build of the same CLI the repo pins in Cargo.lock (tauri 2.x); much faster than
        # `cargo install` on every run.
        run: npm install --global @tauri-apps/cli@2.12.2

      # Bundles the pinned python-build-standalone for THIS target (checksum-verified) plus the
      # pinned upstream source. Same script as a local build.
      - name: Stage the bundled runtime
        run: tools/stage-runtime.sh --target "${{ matrix.target }}"

      - name: Build installers
        working-directory: src-tauri
        env:
          # Signing hooks: empty today, so builds are unsigned. Filled in per docs/RELEASING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty APPLE_* variable is not the same as an absent one to the bundler: unset them
          # so an unsigned build stays unsigned instead of failing on a blank identity.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          tauri build --ci --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"

      - name: Collect installers
        run: |
          tools/collect-bundles.sh "${{ matrix.target }}" --rust-target "${{ matrix.rust_target }}" \
            --out dist --label "${{ needs.plan.outputs.label }}"

      - name: Linux glibc floor
        if: runner.os == 'Linux'
        run: |
          bin="src-tauri/target/${{ matrix.rust_target }}/release/aipotluck-local-client-gui"
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "requires $need"
          echo "### ${{ matrix.target }} requires ${need}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Every push to main: replace the assets of the rolling `nightly` prerelease and move its tag to
  # this commit. Runs only if EVERY enabled target built -- a half-built nightly is worse than
  # yesterday's whole one, which stays in place when anything fails.
  nightly:
    name: Publish nightly
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'nightly'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.plan.outputs.label }}
        run: tools/publish-nightly.sh dist "$LABEL"

  release:
    name: Draft release
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat SHA256SUMS.* > SHA256SUMS
          rm SHA256SUMS.*
          ls -la

      # A DRAFT release: nothing is downloadable until a person reviews it and clicks Publish.
      # Re-running on the same tag replaces the draft's assets rather than failing.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "aipotluck-local-client-gui $VERSION" \
              --notes "Unsigned build. See SHA256SUMS to verify downloads. Built from ${GITHUB_SHA}."
          fi
