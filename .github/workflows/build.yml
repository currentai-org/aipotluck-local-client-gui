# Build the GUI's installers for the ENABLED targets in .github/build-targets.json, and publish them.
#
#   pull_request              build, upload as workflow artifacts only (catch a broken bundle pre-merge)
#   schedule (04:00 UTC)      the nightly: build main's tip, publish it as its own prerelease
#                             (nightly-<date>.<sha>, kept as history) and as the rolling `nightly`
#                             PRERELEASE, whose tag moves to this commit. Stable download URLs:
#                             https://github.com/<repo>/releases/download/nightly/<file>
#                             Skipped, building nothing, when main hasn't moved since the last nightly.
#   push a tag v<version>     build, then create a DRAFT release (a person reviews, then publishes)
#   workflow_dispatch         build; `only` picks one target -- even a DISABLED one -- so a new
#                             platform can be tried in CI without enabling it. `nightly` publishes a
#                             nightly now, from main, even if main hasn't moved (all targets only).
#
# Pushes to main don't build: PR builds already build every enabled target before a merge.
#
# Only enabled targets build by default: Linux, Windows and macOS today, each switched on only after
# it was proven locally with `tools/build.sh --release-target <t>` (flip "enabled" in
# .github/build-targets.json). See docs/RELEASING.md.
#
# GPU support is not a build dimension: one binary per OS x CPU arch covers CUDA/Metal/Vulkan/ROCm,
# because the bundled CLI downloads the matching llama.cpp asset on the user's machine at setup.
#
# Every third-party action is pinned to a full commit SHA (tag in the trailing comment); dependabot
# keeps them current. Builds are UNSIGNED until signing secrets exist (docs/RELEASING.md).

name: build

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    tags: ['v*.*.*']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      only:
        description: 'Build just this target, even if disabled (e.g. windows-x64); empty = all enabled'
        required: false
        default: ''
      nightly:
        description: 'Publish as a nightly now (run from main, all enabled targets), even if main has not moved'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Installers travel between jobs through Current AI's S3 artifact bucket, not GitHub's artifact
# store: GitHub refuses every upload org-wide once the org's artifact storage quota is hit, which
# would stop the nightly and draft releases with it. Jobs reach the bucket through GitHub's OIDC
# token and a role that can read and write only this repo's prefixes (aipotluck.org,
# ci-runners/hostedartifacts.go), so no key is stored here. The ret-14/ prefix expires in 14 days.
# PR builds still try GitHub's artifact store as well, best effort, so the installers can be
# downloaded from the run page when it accepts them.
env:
  ARTIFACT_ROLE: arn:aws:iam::213666289325:role/aipotluck-ci-artifacts-hosted
  ARTIFACT_REGION: us-west-2
  ARTIFACT_URI: s3://aipotluck-ci-artifacts-213666289325-us-west-2/ret-14/${{ github.repository }}/${{ github.run_id }}

concurrency:
  # One build per ref at a time. On main (the nightly, scheduled or run by hand) a newer run
  # supersedes an older one still running: the nightly should always be the tip.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds, before the matrix, if a tag and the app disagree. The label is what the
      # installer file names carry: the version for a release, version-nightly.DATE.SHA otherwise.
      - name: Version and channel
        id: version
        env:
          NIGHTLY: ${{ inputs.nightly }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v=$(python3 tools/release_version.py --tag "${GITHUB_REF_NAME}")
            label="$v"; channel=release
          else
            v=$(python3 tools/release_version.py --check)
            label="${v}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
            channel=none
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              # A quiet day builds nothing: the newest nightly is already this commit.
              last=$(git ls-remote origin 'refs/tags/nightly' 'refs/tags/nightly^{}' | tail -1 | cut -f1)
              if [ "$last" = "$GITHUB_SHA" ]; then channel=skip; else channel=nightly; fi
            elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${NIGHTLY}" = "true" ]; then
              [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::a nightly runs from main, not ${GITHUB_REF}"; exit 1; }
              [ -z "${ONLY}" ] || { echo "::error::a nightly builds every enabled target; leave 'only' empty"; exit 1; }
              channel=nightly
            fi
          fi
          {
            echo "version=$v"
            echo "label=$label"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "version $v, label $label, channel $channel"

      - name: Build matrix
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          m=$(python3 tools/release_version.py --matrix --only "${ONLY}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.channel != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned CLI is a public submodule; the default token can clone it.
          submodules: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.rust_target }}"
          rustup default stable
          rustc -V

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Tauri CLI
        # The npm build of the same CLI the repo pins in Cargo.lock (tauri 2.x); much faster than
        # `cargo install` on every run.
        run: npm install --global @tauri-apps/cli@2.12.2

      # Bundles the pinned python-build-standalone for THIS target (checksum-verified) plus the
      # pinned upstream source. Same script as a local build.
      - name: Stage the bundled runtime
        run: tools/stage-runtime.sh --target "${{ matrix.target }}"

      - name: Build installers
        working-directory: src-tauri
        env:
          # Signing hooks: empty today, so builds are unsigned. Filled in per docs/RELEASING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty APPLE_* variable is not the same as an absent one to the bundler: unset them
          # so an unsigned build stays unsigned instead of failing on a blank identity.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          tauri build --ci --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"

      - name: Collect installers
        run: |
          tools/collect-bundles.sh "${{ matrix.target }}" --rust-target "${{ matrix.rust_target }}" \
            --out dist --label "${{ needs.plan.outputs.label }}"

      # The Apple silicon download must not hold an Intel binary (or vice versa): it would run under
      # Rosetta on every M-series Mac. Checks the app and the Python runtime it bundles.
      - name: macOS architecture
        if: runner.os == 'macOS'
        run: |
          tools/check-macos-arch.sh "$(ls dist/*_${{ matrix.target }}.app.zip)" "${{ matrix.target }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Linux glibc floor
        if: runner.os == 'Linux'
        run: |
          bin="src-tauri/target/${{ matrix.rust_target }}/release/aipotluck-local-client-gui"
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "requires $need"
          echo "### ${{ matrix.target }} requires ${need}" >> "$GITHUB_STEP_SUMMARY"

      # Dependabot's PRs get no OIDC token, so they build without keeping the installers.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          role-to-assume: ${{ env.ARTIFACT_ROLE }}
          aws-region: ${{ env.ARTIFACT_REGION }}

      - name: Keep installers in S3
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          compgen -G 'dist/*' > /dev/null || { echo "no installers in dist/" >&2; exit 1; }
          aws s3 cp dist/ "$ARTIFACT_URI/installers-${{ matrix.target }}/" --recursive --only-show-errors
          aws s3 ls "$ARTIFACT_URI/installers-${{ matrix.target }}/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The nightly: publish this build as its own dated prerelease, then replace the assets of the
  # rolling `nightly` prerelease and move its tag to this commit (tools/publish-nightly.sh). Runs
  # only if EVERY enabled target built -- a half-built nightly is worse than yesterday's whole one,
  # which stays in place when anything fails.
  nightly:
    name: Publish nightly
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'nightly'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ARTIFACT_ROLE }}
          aws-region: ${{ env.ARTIFACT_REGION }}

      - name: Fetch every target's installers
        run: |
          aws s3 cp "$ARTIFACT_URI/" s3dl/ --recursive --only-show-errors
          mkdir -p dist
          find s3dl -type f -exec mv -t dist {} +
          ls -la dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.plan.outputs.label }}
        run: tools/publish-nightly.sh dist "$LABEL"

  release:
    name: Draft release
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ARTIFACT_ROLE }}
          aws-region: ${{ env.ARTIFACT_REGION }}

      - name: Fetch every target's installers
        run: |
          aws s3 cp "$ARTIFACT_URI/" s3dl/ --recursive --only-show-errors
          mkdir -p dist
          find s3dl -type f -exec mv -t dist {} +
          ls -la dist

      # Adds the fixed ("latest") names aipotluck.org links to, and one SHA256SUMS for everything.
      # Fails, creating no draft, if any name in .github/latest-download-names.txt would be missing
      # (docs/RELEASING.md, "Fixed latest download links").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src

      - name: Fixed names and checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          src/tools/stage-release.sh dist "$VERSION"
          ls -la dist

      # A DRAFT release: nothing is downloadable until a person reviews it and clicks Publish.
      # Re-running on the same tag replaces the draft's assets rather than failing.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # --generate-notes: GitHub lists the PRs merged since the previous release, under
            # the note below (tools/release.sh makes the tag).
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "GUI v$VERSION" --generate-notes \
              --notes-file <(printf '%s\n' \
                "**Which macOS download?** Apple silicon (M1 and later): \`_macos-arm64.dmg\`. Intel Macs only: \`_macos-x64.dmg\`. The Intel build runs on Apple silicon only under Rosetta, and much slower." \
                "" \
                "Unsigned build. See SHA256SUMS to verify downloads. Built from ${GITHUB_SHA}." \
                "First open on macOS: System Settings -> Privacy & Security -> Open Anyway. On Windows: More info -> Run anyway.")
          fi
